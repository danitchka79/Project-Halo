<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MICI Module Design Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: left = one question at a time with options, trade-offs and notes; right = illustration of the selected option + running brief and fit check. */
  --bg: #eef2ef;
  --surface: #ffffff;
  --ink: #15302b;
  --muted: #56706a;
  --line: #cfdbd6;
  --leaf: #2f7d4f;
  --leaf-soft: #dcefe3;
  --accent: #0f6b74;
  --accent-ink: #ffffff;
  --water: #d4e7ec;
  --cost: #a5470f;
  --cost-soft: #fbe8d8;
  --open: #6a4fa3;
  --open-soft: #ece6f7;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1917; --surface: #15241f; --ink: #e3eee9; --muted: #93aba3; --line: #2a3d37;
    --leaf: #6cc28d; --leaf-soft: #1c3727; --accent: #4fb3bd; --accent-ink: #08201f; --water: #17323a;
    --cost: #eda46a; --cost-soft: #3a2614; --open: #b9a4ea; --open-soft: #2a2340; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1917; --surface: #15241f; --ink: #e3eee9; --muted: #93aba3; --line: #2a3d37;
  --leaf: #6cc28d; --leaf-soft: #1c3727; --accent: #4fb3bd; --accent-ink: #08201f; --water: #17323a;
  --cost: #eda46a; --cost-soft: #3a2614; --open: #b9a4ea; --open-soft: #2a2340; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
header { padding: 20px max(16px, 3vw) 6px; display: grid; gap: 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 80ch; }
main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; padding: 12px max(16px, 3vw) 32px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.steps button { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.steps button.done { color: var(--ink); border-color: var(--leaf); }
.steps button.current { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps button:disabled { cursor: default; opacity: .5; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.15; margin: 4px 0 8px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; }
.why { color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
.tradeoff { border-left: 4px solid var(--accent); background: var(--water); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 0 0 16px; }
.versus { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; margin: 6px 0 10px; color: var(--accent); }
.versus span { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; text-wrap: balance; font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 4.5vw, 26px); line-height: 1.1; color: var(--ink); background: var(--surface); border: 2px solid var(--accent); border-radius: 8px; padding: 6px 12px; }
.versus svg { width: 56px; height: 18px; flex: none; }
.tradeoff b { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); display: block; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; font: inherit; color: inherit; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.opt.noimg { grid-template-columns: 1fr; padding: 12px 14px; }
.opt img { width: 96px; height: 72px; object-fit: cover; border-radius: 5px; display: block; }
.opt:hover { border-color: var(--accent); }
.opt.blocked { opacity: .55; cursor: not-allowed; }
.opt.blocked:hover { border-color: var(--line); }
.opt.blocked span { color: var(--cost); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); box-shadow: inset 4px 0 0 var(--accent); }
.opt strong { font-size: 17px; display: block; }
.opt span { color: var(--muted); font-size: 14.5px; }
.multi-note { font-size: 13.5px; color: var(--muted); margin: -4px 0 10px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.detail { margin-top: 18px; display: grid; gap: 14px; }
.detail-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .tg { grid-template-columns: 1fr; } }
.col { border-radius: 8px; padding: 12px 14px; }
.col.gain { background: var(--leaf-soft); }
.col.cost { background: var(--cost-soft); }
.col h4 { margin: 0 0 6px; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.col.gain h4 { color: var(--leaf); }
.col.cost h4 { color: var(--cost); }
.col ul { margin: 0; padding-left: 18px; font-size: 15px; }
.col li { margin: 3px 0; }
.notes { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 15px; }
.tag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 2px; }
.t-spec { background: var(--water); color: var(--accent); }
.t-logic { background: var(--leaf-soft); color: var(--leaf); }
.t-rule { background: var(--ink); color: var(--surface); }
.t-open { background: var(--open-soft); color: var(--open); }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.side { display: grid; gap: 20px; }
@media (min-width: 901px) { .side { position: sticky; top: 12px; } }
.fig img.main { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--water); }
.fig .noimage { aspect-ratio: 4 / 3; display: grid; place-items: center; text-align: center; padding: 20px; border-radius: 8px; background: var(--water); color: var(--muted); }
.fig figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.thumbs { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.thumbs button { padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer; }
.thumbs button[aria-pressed="true"] { border-color: var(--accent); }
.vthumb { display: flex; align-items: center; justify-content: center; width: 72px; height: 54px; overflow: hidden; border-radius: 4px; background: #eef4f2; }
.vthumb svg { max-width: 72px; max-height: 54px; width: auto !important; height: auto !important; pointer-events: none; }
.vlab { display: block; font-size: 10px; color: #5b6f6a; text-align: center; margin-top: 2px; }
.schem-one .t { display: none; }
.schem:hover .schem-one .t { display: block; }
.schem:hover .schem-one .n:has(+ .t) { display: none; }
.schem-one svg { width: 100%; height: auto; max-height: 520px; }
.thumbs img { width: 72px; height: 54px; object-fit: cover; border-radius: 4px; display: block; }
.thumb-text { width: 72px; height: 54px; padding: 2px; line-height: 1.15; display: grid; place-items: center; border-radius: 4px; background: var(--water); color: var(--muted); font-size: 11px; text-align: center; }
.brief { display: grid; gap: 12px; }
.brief dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; }
.brief dt { color: var(--muted); }
.brief dd { margin: 0; font-weight: 600; }
.flags { display: grid; gap: 8px; }
.flag { border-left: 4px solid var(--cost); background: var(--cost-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14.5px; }
.flag.ok { border-color: var(--leaf); background: var(--leaf-soft); }
.key { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.final-step { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.final-step h3 span { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 15px; }
.copied { font-size: 13px; color: var(--leaf); margin-left: 8px; }
@media (prefers-reduced-motion: no-preference) { .opt, .btn { transition: border-color .15s, background .15s; } }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(5, 15, 13, .88); display: none; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox .lb-nav { top: 50%; transform: translateY(-50%); font-size: 34px; line-height: 1; padding: 8px 16px; }
#lb-prev { left: 16px; right: auto; }
#lb-dl { right: 96px; }
#lb-next { right: 16px; }
#lb-count { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); color: #fff; font: 600 14px var(--font-body); opacity: .85; }
.lightbox.single .lb-nav, .lightbox.single #lb-count, .lightbox.svg .lb-nav, .lightbox.svg #lb-count { display: none; }
#fig { position: relative; }
.fignav { position: absolute; z-index: 3; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 24px; line-height: 36px; padding: 0; cursor: pointer; transform: translateY(-50%); }
.fignav:hover { background: rgba(0,0,0,.7); }
#lb-svg { display: none; width: min(1100px, 100%); max-height: 100%; overflow: auto; background: #fff; border-radius: 8px; padding: 10px; cursor: default; }
.lightbox.svg #lb-svg { display: block; }
.lightbox.svg #lb-img { display: none; }
#lb-svg:hover .t { display: block; }
#lb-svg:hover .n:has(+ .t) { display: none; }
#lb-svg svg { max-height: calc(100vh - 80px); }
img.main { cursor: zoom-in; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.lightbox button { position: absolute; top: 14px; right: 16px; font: 600 15px var(--font-body); color: #fff; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
img { cursor: zoom-in; }
.sthumb { --float: #1e1e1e; --sub: #4f9a3f; --pipe: #e3a33b; display: block; width: 96px; height: 72px; flex: none; background: #eef4f2; border-radius: 5px; overflow: hidden; }
.sthumb svg { width: 96px !important; height: 72px !important; display: block; }
.sthumb svg text, .sthumb svg line { display: none; }
.cthumb { position: relative; display: block; width: 96px; height: 72px; flex: none; }
.cthumb img { width: 96px; height: 72px; object-fit: cover; border-radius: 5px; display: block; }
.sthumb img.cbadge, .cthumb img.cbadge { position: absolute; right: -6px; bottom: -6px; width: 46px; height: 35px; object-fit: contain; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.schem { --float: #1e1e1e; --sub: #4f9a3f; --pipe: #e3a33b; display: block; width: 100%; margin-top: 8px; padding: 8px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; text-align: left; font: inherit; }
.schem:hover { border-color: var(--accent); }
.schem svg { width: 100%; height: auto; display: block; }
.schem-sec { margin-top: 6px; }
.schem-curve { margin-top: 6px; display: grid; gap: 6px; }
.schem-curve svg { background: #eef4f2; border-radius: 6px; }
.schem-go { display: block; margin-top: 6px; font-weight: 600; color: #0f6b74; font-size: 14px; }
.toptabs { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
.toptabs button { font: 600 15px var(--font-body); padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.toptabs button.on { background: var(--accent); color: var(--accent-ink); }
#pane-calc { padding: 0 max(16px, 3vw) 20px; }
#calcFrame { width: 100%; height: calc(100vh - 120px); min-height: 700px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.calcnote { margin: 6px 0 10px; padding: 8px 12px; border-left: 4px solid var(--leaf); background: var(--leaf-soft); border-radius: 0 6px 6px 0; }
</style>
</head>
<body>
<header>
  <h1>MICI Module Design Guide</h1>
  <nav class="toptabs" role="tablist"><button data-pane="guide" class="on" role="tab">Design guide</button><button data-pane="calc" role="tab">Float calculator</button></nav>
  <p>A questionnaire that takes a MICI project from the type of structure the client wants to mooring; the questions shown depend on earlier answers. Every option lists what you gain and what you give up, and the fit check flags choices that work against each other. </p>
</header>
<main id="pane-guide">
  <section class="panel" id="q" aria-live="polite"></section>
  <aside class="side">
    <figure class="panel fig" id="fig" style="margin:0"></figure>
    <section class="panel brief" id="brief"></section>
  </aside>
</main>

<section id="pane-calc" hidden><div id="calcNote" class="calcnote" hidden></div><iframe id="calcFrame" src="calculator.html" title="MICI Float Comparison Calculator"></iframe></section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image"><button type="button" id="lb-close">Close</button><button type="button" class="lb-nav" id="lb-prev" aria-label="Previous image">‹</button><button type="button" class="lb-nav" id="lb-next" aria-label="Next image">›</button><span id="lb-count"></span><button type="button" id="lb-dl" hidden>Download</button><img id="lb-img" alt=""><div id="lb-svg" class="schem-one"></div></div>

      { id: "mid", label: "Moderate: about 2–5 m", sub: "Most marinas and sheltered bays.", imgs: [],
        gains: ["Both piles and catenary moorings are practical", "Clear of the seabed at low tide in most cases"],
        costs: ["Mooring choice depends on seabed type and tidal range"], notes: [] },
      { id: "deep", label: "Deep: about 5–20 m", sub: "Outer harbours, behind reefs, deeper bays.", imgs: [],
        gains: ["No grounding risk", "Suits fully floating structures"],

      { id: "catenary", label: "Catenary or bridle", sub: "Chains and anchors, single or bridled.", imgs: [],
        gains: ["Works in most water depths", "No piling equipment"],

      { id: "arm", label: "Rigid arm to shore or structure", sub: "Strut connection.", imgs: [],

      { id: "open", label: "Keep it open", sub: "Design fixings for all types.", imgs: [],

const answers = {};
let STEPS = ALL_STEPS;
let current = 0;
let focusOpt = {};   // last clicked option per step, for the illustration
let imgIndex = 0, calcView = 0, calcVar = 0, calcShow = null;

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const TERMS = /(mangroves[–-]path[–-]mangroves|path[–-]mangroves[–-]path|floating forest)/gi;
const fmt = s => esc(s).replace(TERMS, m => `<b>"${m}"</b>`);
const qt = s => String(s).replace(TERMS, m => `"${m}"`);
const tagHtml = t => `<span class="tag t-${t}">${TAGS[t]}</span>`;
const sel = id => answers[id];
const wideF = () => typeof answers.ratio === "string" && answers.ratio.startsWith("pair");
const SHAPE_OF = { smallHex: "hex", smallOct: "oct", ring: "rect", step: "rect", hexRing: "hex", hexStep: "hex", octRing: "oct", octStep: "oct", sqRing: "rect", sqStep: "rect", pair: "rect", pairRetro: "rect" };
const SHAPE_NAME = { rect: "square or rectangular", hex: "hexagonal", oct: "octagonal" };
const fixedShape = () => SHAPE_OF[answers.ratio];
const narrowF = () => !!answers.ratio && !wideF();
const has = (id, opt) => { const a = answers[id]; return Array.isArray(a) ? a.includes(opt) : a === opt; };
const optsOf = step => { const a = answers[step.id]; if (!a) return []; return step.options.filter(o => Array.isArray(a) ? a.includes(o.id) : o.id === a); };
const answered = step => optsOf(step).length > 0;

function conflicts() {
  const out = [];
  const narrow = narrowF();
  if (narrow && (answers.buoyancy || []).length === 1 && has("buoyancy", "cells")) out.push("Soil cells add little buoyancy on their own. Combine them with lightweight substrate, perimeter floats or internal chambers.");
  if (has("limits", "noroot") && ["vertical", "horizontal", "complex"].some(x => has("buoyancy", x))) out.push("No inside-planter buoyancy compartments are allowed, but internal chambers are selected.");
  if (has("limits", "nolight") && (has("buoyancy", "lighter") || has("substrate", "light") || has("substrate", "layered"))) out.push("Lightweight substrate is ruled out but chosen elsewhere.");
  if (has("limits", "minplastic") && ["more", "small", "tall"].some(x => has("buoyancy", x))) out.push("Plastic is to be minimised, but the chosen float solution adds plastic comparable to the large floats.");
  if (has("limits", "minplastic") && !has("buoyancy", "lighter") && ["vertical", "horizontal", "complex"].some(x => has("buoyancy", x))) out.push("Internal compartments reduce plastic only partly. To truly minimise plastic, add lightweight substrate.");
  if (narrow && has("limits", "minplastic") && has("limits", "nolight")) out.push("Minimising plastic and ruling out lightweight substrate together leave no way to replace the buoyancy lost from narrower floats.");
  if (wideF() && has("access", "fullmesh")) out.push("With wide floats the paths are already on the floats. Full mesh over the planter is optional unless people must reach the plants from above.");
  if (has("config", "park") && has("site", "fiji")) out.push("Floating park in a cyclone region: plan to design it for the full cyclone case or to remove and shelter it before landfall.");
  if (has("jettyLayout", "pmp") && narrowF()) out.push("Path–mangroves–path on narrow floats: the outside paths need a deck that overhangs the floats and/or the planter edge (or separate walkway modules). Check the path width and heel under pedestrian load.");
  if (has("jettyLayout", "mpm") && wideF()) out.push("A mangroves–path–mangroves jetty on wide floats needs small non-buoyant planters attached along the outside edges (retrofit).");
  if (has("depth", "deep") && has("mooring", "pile")) out.push("Piles in deep water are long and expensive. Consider catenary or taut moorings.");
  if (has("depth", "shallow") && narrowF()) out.push("Shallow site: check that the floats and hanging roots stay clear of the seabed at the lowest tide.");
  if ((answers.access || []).length === 1 && has("access", "formal")) out.push("Formal walkways alone do not meet the spec requirement to walk through the planting area. Combine them with another access option.");
  if (has("access", "substrate") && !has("buoyancy", "cells") && (has("substrate", "heavy") || has("substrate", "light"))) out.push("Walking directly on substrate needs a compact surface. Consider soil cells or panels, especially with sand, mud or loose light media.");
  if (has("site", "exposed")) out.push("The site is outside the MICI wave envelope.");
  if (has("buoyancy", "tall") && has("access", "substrate")) out.push("Narrow, tall floats reduce stability just where people walk on the planting surface. Check uneven loading.");
  return out;
}

function stepNav() {
  const done = STEPS.filter(answered).length;
  return STEPS.map((s, i) => {
    const reachable = i === 0 || answered(STEPS[i - 1]) || i <= current;
    const cls = i === current ? "current" : (answered(s) ? "done" : "");
    return `<button class="${cls}" data-go="${i}" ${reachable ? "" : "disabled"} aria-label="Question ${i + 1}: ${esc(s.title)}">${i + 1} ${s.short}</button>`;
  }).join("") + `<button class="${current === STEPS.length ? "current" : ""}" data-go="${STEPS.length}" ${done === STEPS.length ? "" : "disabled"}>Brief</button>`;
}

function tradeCols(o, step) {
  const [g, c] = (step && step.cols) || ["You gain", "You give up"];
  return `<div class="tg">
    <div class="col gain"><h4>${g}</h4><ul>${o.gains.map(g => `<li>${fmt(g)}</li>`).join("")}</ul></div>
    <div class="col cost"><h4>${c}</h4><ul>${o.costs.map(c => `<li>${fmt(c)}</li>`).join("")}</ul></div>
  </div>${o.notes.length ? `<div class="notes">${o.notes.map(([t, s]) => `<div class="item">${tagHtml(t)}<div>${fmt(s)}</div></div>`).join("")}</div>` : ""}`;
}

function renderQuestion() {
  const el = document.getElementById("q");
  if (current === STEPS.length) { renderFinal(el); return; }
  const step = STEPS[current];
  const chosenList = optsOf(step);
  const opts = step.options.map(o => {
    const on = has(step.id, o.id);
    const tsrc = o.thumb || (o.imgs.length && IMG[o.imgs[0]][0]);
    const sch = ((step.id === "buoyancy" || step.id === "ratio") && o.calc) ? calcSchematic(o) : null;
    const csrc = o.custom ? (o.thumb || (o.imgs.length && IMG[o.imgs[0]][0])) : null;
    const dsch = o.draw ? smallModulesSvg(o.drawShape || fixedShape(), (o.drawShape || fixedShape()) === "hex") : null;
    const thumb = dsch ? `<span class="sthumb" style="position:relative;overflow:visible">${dsch.plan}${o.custom ? `<img class="cbadge" src="img/custom.svg" alt="Custom">` : ""}</span>` : sch ? `<span class="sthumb" style="position:relative;overflow:visible">${sch.plan}${o.custom ? `<img class="cbadge" src="img/custom.svg" alt="Custom">` : ""}</span>` : o.custom ? (csrc ? `<span class="cthumb"><img src="${csrc}" alt=""${o.thumbFit ? ` style="object-fit:${o.thumbFit};background:#fff"` : ""}><img class="cbadge" src="img/custom.svg" alt="Custom"></span>` : `<img src="img/custom.svg" alt="Custom" style="object-fit:contain;background:#fff">`) : tsrc ? `<img src="${tsrc}" alt=""${o.thumbFit ? ` style="object-fit:${o.thumbFit};background:#fff"` : ""}>` : "";
    const off = blocked(o);
    return `<button class="opt ${tsrc || o.custom || sch || o.draw ? "" : "noimg"}${off ? " blocked" : ""}" id="opt-${step.id}-${o.id}" data-opt="${o.id}" aria-pressed="${on}" ${off ? "disabled" : ""}>
      ${thumb}<div><strong>${fmt(o.label)}</strong><span>${fmt(off ? (o.blockedIf && o.blockedIf() ? o.blockedIfReason() : o.blockedBy.reason) : o.sub)}</span></div></button>`;
  }).join("");
  const detail = chosenList.map(o => `<div class="detail"><div class="detail-head"><h3>${fmt(o.label)}</h3></div>${tradeCols(o, step)}${o.calc ? `<div style="margin-top:10px"><button class="btn primary" data-calc="${o.id}">Size this float in the calculator →</button></div>` : ""}</div>`).join("");
  el.innerHTML = `
    <div class="steps">${stepNav()}</div>
    <div class="eyebrow">Question ${current + 1} of ${STEPS.length} · ${fmt(step.title)}</div>
    <h2>${fmt(step.q)}</h2>
    <p class="why">${fmt(typeof step.why === "function" ? step.why() : step.why)}</p>
    <div class="tradeoff">${step.frame ? `<div class="versus"><span>${fmt(step.frame)}</span></div>` : "<b>The trade-off</b>"}${step.versus ? `<div class="versus"><span>${fmt(step.versus[0])}</span><svg viewBox="0 0 64 20" aria-label="against" role="img"><path d="M2 10 H62 M10 2 L2 10 L10 18 M54 2 L62 10 L54 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${fmt(step.versus[1])}</span></div>` : ""}${fmt(step.tradeoff)}</div>
    ${step.multi ? `<p class="multi-note">Select all that apply.</p>` : ""}
    <div class="options" role="group" aria-label="${esc(step.title)}">${opts}</div>
    ${detail}
    <div class="nav">
      <button class="btn" id="back" ${current === 0 ? "disabled" : ""}>Back</button>
      <button class="btn primary" id="next" ${chosenList.length ? "" : "disabled"}>${current === STEPS.length - 1 ? "See design brief" : "Next question"}</button>
    </div>`;
  bind(el);
}

function renderFinal(el) {
  const opens = [];
  STEPS.forEach(s => optsOf(s).forEach(o => o.notes.forEach(([t, n]) => { if (t === "open") opens.push(n); })));
  const c = conflicts();
  el.innerHTML = `
    <div class="steps">${stepNav()}</div>
    <div class="eyebrow">Design brief</div>
    <h2>Your MICI module, with its trade-offs</h2>
    <p class="why">This frames a concept. It is not an engineered design: buoyancy, stability and connection loads still need calculation, and open questions need testing.</p>
    <div class="final-step"><h3>Fit check</h3><div class="flags">${c.length ? c.map(x => `<div class="flag">${fmt(x)}</div>`).join("") : `<div class="flag ok">No conflicts between your choices.</div>`}</div></div>
    ${opens.length ? `<div class="final-step"><h3>Open questions</h3><ul style="margin:0;padding-left:18px">${opens.map(o => `<li>${fmt(o)}</li>`).join("")}</ul></div>` : ""}
    ${STEPS.map(s => `<div class="final-step"><h3>${fmt(s.title)} <span>· ${s.versus ? esc(s.versus[0] + " ↔ " + s.versus[1] + ". ") : ""}${fmt(s.tradeoff)}</span></h3>${optsOf(s).map(o => `<div class="detail" style="margin-top:4px"><div class="detail-head"><h3>${fmt(o.label)}</h3></div>${tradeCols(o, s)}</div>`).join("")}</div>`).join("")}
    <div class="nav">
      <button class="btn" id="restart">Start again</button>
      <span><button class="btn primary" id="copy">Copy brief as text</button><span class="copied" id="copied"></span></span>
    </div>`;
  bind(el);
  document.getElementById("restart").onclick = () => { for (const k in answers) delete answers[k]; focusOpt = {}; current = 0; update(); };
  document.getElementById("copy").onclick = async () => {
    const L = ["MICI module design brief", ""];
    if (c.length) { L.push("Fit check:"); c.forEach(x => L.push("- " + x)); L.push(""); }
    if (opens.length) { L.push("Open questions:"); opens.forEach(x => L.push("- " + x)); L.push(""); }
    STEPS.forEach(s => {
      L.push(`${s.title.toUpperCase()}`, `Trade-off: ${s.versus ? s.versus[0] + " <-> " + s.versus[1] + ". " : ""}${s.tradeoff}`);
      optsOf(s).forEach(o => {
        L.push(`Choice: ${o.label}`);
        o.gains.forEach(g => L.push(`  ${s.cols ? s.cols[0] + ":" : "+"} ${g}`));
        o.costs.forEach(g => L.push(`  ${s.cols ? s.cols[1] + ":" : "-"} ${g}`));
        o.notes.forEach(([t, n]) => L.push(`  [${TAGS[t]}] ${n}`));
      });
      L.push("");
    });
    const msg = document.getElementById("copied");
    try { await navigator.clipboard.writeText(qt(L.join("\n"))); msg.textContent = "Copied"; }
    catch (e) { msg.textContent = "Copy was blocked. Select the text on the page instead."; }
  };
}

function choose(step, optId) {
  if (step.multi) {
    let a = Array.isArray(answers[step.id]) ? answers[step.id].slice() : [];
    if (a.includes(optId)) a = a.filter(x => x !== optId);
    else {
      if (step.exclusive && optId === step.exclusive) a = [];
      else if (step.exclusive) a = a.filter(x => x !== step.exclusive);
      a.push(optId);
    }
    if (a.length) answers[step.id] = a; else delete answers[step.id];
  } else answers[step.id] = optId;
  focusOpt[step.id] = optId;
  imgIndex = 0; calcView = 0; calcVar = 0; calcShow = null;
}

function bind(el) {
  el.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => { const st = STEPS[current]; choose(st, b.dataset.opt); const o = st.options.find(x => x.id === b.dataset.opt); if (st.id === "ratio" && o && o.calc && o.calc.shape) answers.shape = { square: "rect", hex: "hex", oct: "oct" }[o.calc.shape]; update(); });
  el.querySelectorAll("[data-calc]").forEach(b => b.onclick = () => sendToCalc(STEPS[current].options.find(o => o.id === b.dataset.calc)));
  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { current = +b.dataset.go; imgIndex = 0; calcShow = null; calcVar = 0; update(); });
  const back = document.getElementById("back"), next = document.getElementById("next");
  if (back) back.onclick = () => { current--; imgIndex = 0; calcShow = null; calcVar = 0; update(); };
  if (next) next.onclick = () => { current++; imgIndex = 0; calcShow = null; calcVar = 0; update(); };
}

function renderFigure() {
  const el = document.getElementById("fig");
  let step = STEPS[Math.min(current, STEPS.length - 1)];
  if (current === STEPS.length) step = STEPS[0];
  let opt = step.options.find(o => o.id === focusOpt[step.id]) || optsOf(step)[0];
  let example = false;
  if (!opt) { opt = step.options.find(o => o.imgs.length) || step.options[0]; example = true; }
  if (opt.draw) {
    const isC = has("jettyShape", "curved"), isS = has("jettyShape", "straight");
    const J = opt.jetty && (opt.drawShape || fixedShape()) === "oct" ? ["Jetty, straight", "Jetty, curved"].filter((_, j) => j ? !isS : !isC) : [], nd = 1 + J.length;
    const imgs = opt.imgs.filter(k => !(isC && k === "smallOctJetS") && !(isS && k === "smallOctJetC"));
    const n = imgs.length + nd, i = Math.min(imgIndex, n - 1);
    const thumbs = `<div class="thumbs"><button data-img="0" aria-pressed="${i === 0}" aria-label="Show schematic"><span class="thumb-text">Schematic</span></button>${J.map((t, j) => `<button data-img="${j + 1}" aria-pressed="${i === j + 1}" aria-label="Show schematic: ${t}"><span class="thumb-text">${t}</span></button>`).join("")}${imgs.map((k, j) => `<button data-img="${j + nd}" aria-pressed="${j + nd === i}" aria-label="Show image ${j + 1}">${IMG[k][0] ? `<img src="${IMG[k][2] || IMG[k][0]}" data-full="${IMG[k][0]}" alt="">` : `<span class="thumb-text">No render</span>`}</button>`).join("")}</div>`;
    if (i > 0 && i < nd) {
      const curved = J[i - 1] === "Jetty, curved", d = octJettySvg(curved);
      el.innerHTML = `<div class="eyebrow">Schematic${example ? " · example option" : ""}</div><div class="schem" style="cursor:default"><div class="schem-plan" style="grid-column:1/-1">${d.plan}</div><div class="schem-sec" style="grid-column:1/-1">${d.sec}</div></div>${thumbs}<figcaption><b>Mangroves–path–mangroves, ${curved ? "curved" : "straight"}.</b> Four small octagonal modules across: decking between the two middle columns${curved ? ", curving between the trees" : ""}, and one tree per group of four modules on either side.</figcaption>`;
    } else if (i === 0) {
      const d = smallModulesSvg(opt.drawShape || fixedShape(), smallMany);
      el.innerHTML = `<div class="eyebrow">Schematic${example ? " · example option" : ""}</div><div class="schem" style="cursor:default"><div class="schem-plan" id="smallPlan" style="cursor:pointer" title="Click to switch between one tree and several trees">${d.plan}</div><div class="schem-sec">${d.big}</div></div>${thumbs}<figcaption><b>${fmt(opt.label)}.</b> Plan and section of one mangrove spreading over several small modules, in your module shape.</figcaption>`;
      document.getElementById("smallPlan").onclick = () => { smallMany = !smallMany; renderFigure(); };
    } else {
      const [src, cap] = IMG[imgs[i - nd]];
      el.innerHTML = `<div class="eyebrow">Illustration${example ? " · example option" : ""}</div>${src ? `<img class="main" src="${src}" alt="${esc(cap)}" style="margin-top:8px">` : `<div class="noimage" style="margin-top:8px">${fmt(cap)}</div>`}${thumbs}<figcaption><b>${fmt(opt.label)}.</b> ${fmt(cap)}</figcaption>`;
    }
    el.querySelectorAll("[data-img]").forEach(b => b.onclick = () => { imgIndex = +b.dataset.img; renderFigure(); });
    return;
  }
  if (opt.calc) {
    const V = opt.calcVariants || [{ ...opt.calc, short: "Schematic" }], nv = V.length, vv = Math.min(calcVar, nv - 1), ni = opt.imgs.length;
    const show = calcShow || (ni ? "img" : "view"), pi = Math.min(imgIndex, Math.max(ni - 1, 0));
    const vopt = { ...opt, calc: (({ short, ...c }) => c)(V[vv]) }, sch = calcSchematic(vopt);
    let views = [];
    if (sch) {
      views = [["Plan", sch.plan, sch.planT], ["Section", sch.bigN || sch.big || sch.sec, sch.big]];
      if (has("jettyShape", "curved")) { if (sch.curve) views.push(["Curved jetty", sch.curve, sch.curveT]); if (sch.pond) views.push(["Pond", sch.pond, sch.pondT]); }
    }
    const vi = Math.min(calcView, Math.max(views.length - 1, 0)), onView = show === "view" || !ni;
    const vthumb = (t, svg) => `<span class="vthumb">${svg}</span><span class="vlab">${t}</span>`;
    const thumbs = `<div class="thumbs">${nv > 1 ? V.map((v, j) => `<button data-var="${j}" aria-pressed="${vv === j}" aria-label="Variant: ${esc(v.short)}"><span class="thumb-text">${esc(v.short)}</span></button>`).join("") : ""}${views.map(([t, svg], k) => `<button data-view="${k}" aria-pressed="${onView && vi === k}" aria-label="Show ${t}">${vthumb(t, svg)}</button>`).join("")}${opt.imgs.map((k, j) => `<button data-img="${j}" aria-pressed="${!onView && j === pi}" aria-label="Show image ${j + 1}">${IMG[k][0] ? `<img src="${IMG[k][2] || IMG[k][0]}" data-full="${IMG[k][0]}" alt="">` : `<span class="thumb-text">No render</span>`}</button>`).join("")}</div>`;
    if (onView) {
      const [vt, vn, vtr] = views[vi] || [];
      el.innerHTML = `<div class="eyebrow">Schematic from the Float calculator${example ? " · example option" : ""}</div>
        <div class="schem" id="schem" role="button" tabindex="0" title="Hover: show the mangroves · click: enlarge · right-click: open in the Float calculator">${sch ? `<div class="schem-one" id="schemPic"><div class="n">${vn}</div>${vtr ? `<div class="t">${vtr}</div>` : ""}</div>` : `<div class="noimage">Loading schematic…</div>`}<span class="schem-go" id="schemGo" style="cursor:pointer">Open in the Float calculator →</span></div>
        ${thumbs}
        <figcaption><b>${fmt(nv > 1 ? V[vv].label : opt.label)}${vt ? " · " + vt.toLowerCase() : ""}.</b> At the calculator's default inputs. Hover to show the mangroves, click to enlarge, right-click to open it in the Float calculator and size it.</figcaption>`;
      const sc = document.getElementById("schem");
      sc.onclick = e => { if (e.target.closest("#schemGo")) return sendToCalc(vopt); const pic = document.getElementById("schemPic"); if (pic) openLbSvg(pic.innerHTML); };
      sc.oncontextmenu = e => { e.preventDefault(); sendToCalc(vopt); };
    } else {
      const [src, cap] = IMG[opt.imgs[pi]];
      el.innerHTML = `<div class="eyebrow">Illustration${example ? " · example option" : ""}</div>
        ${src ? `<img class="main" src="${src}" alt="${esc(cap)}" style="margin-top:8px">` : `<div class="noimage" style="margin-top:8px">${fmt(cap)}</div>`}
        ${thumbs}
        <figcaption><b>${fmt(opt.label)}.</b> ${fmt(cap)}</figcaption>`;
    }
